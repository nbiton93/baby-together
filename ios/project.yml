name: BabyTogether
options:
  bundleIdPrefix: com.natibiton
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: com.natibiton.babytogether
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '2'
    GOOGLE_CLIENT_ID: ''
    GOOGLE_URL_SCHEME: com.natibiton.babytogether
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  BabyTogether:
    type: application
    platform: iOS
    sources:
      - path: BabyTogether
      - path: ../shared
        type: folder
        buildPhase: resources
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Baby Together
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: Google
            CFBundleURLSchemes: ['$(GOOGLE_URL_SCHEME)']
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
schemes:
  BabyTogether:
    build:
      targets:
        BabyTogether: all
    run:
      config: Debug
    archive:
      config: Release
