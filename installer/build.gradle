plugins { id 'com.android.application' version '8.11.1' }
android {
    namespace 'com.natibiton.babytogether.installer'
    compileSdk 36
    defaultConfig {
        applicationId 'com.natibiton.babytogether.installer'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.3.0-helper'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'UPDATE_SHA256', '"' + providers.gradleProperty('updateSha256').getOrElse('NOT_PREPARED') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets {
        main { assets.srcDirs = ['build/generated/update-assets'] }
        androidTest { assets.srcDirs = ['build/generated/test-assets'] }
    }
    buildTypes { release { minifyEnabled false } }
    packaging { resources { excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'] } }
}
dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.android.tools.build:apksig:8.11.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
