plugins { id 'com.android.application' }
android {
    namespace 'com.natibiton.babytogether'
    compileSdk 36
    defaultConfig {
        applicationId 'com.natibiton.babytogether'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'GOOGLE_CONFIGURED', providers.gradleProperty('googleConfigured').getOrElse('false') == 'true' ? 'true' : 'false'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDirs = ['../../shared'] } }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
