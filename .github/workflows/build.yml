name: Build Baby Together
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash -n scripts/sign-android.sh
      - run: node scripts/check.cjs
      - run: node --test tests/*.test.cjs
        env:
          TZ: UTC
  android:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOOGLE_CONFIGURED: ${{ vars.GOOGLE_ANDROID_CONFIGURED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile and lint Android
        run: |
          node scripts/check-google-config.cjs android
          gradle -p android --no-daemon assembleRelease lintRelease -PgoogleConfigured="$GOOGLE_CONFIGURED"
          grep -F 'GOOGLE_CONFIGURED = true' android/app/build/generated/source/buildConfig/release/com/natibiton/babytogether/BuildConfig.java
      - name: Verify update identity and packaged interface
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          apk = pathlib.Path("android/app/build/outputs/apk/release/app-release-unsigned.apk")
          sdk = pathlib.Path(__import__("os").environ["ANDROID_HOME"])
          aapt = sdk / "build-tools/35.0.0/aapt"
          metadata = subprocess.check_output([str(aapt), "dump", "badging", str(apk)], text=True)
          assert "name='com.natibiton.babytogether'" in metadata
          assert "versionCode='3'" in metadata and "versionName='0.3.0'" in metadata
          with zipfile.ZipFile(apk) as bundle:
              for source in pathlib.Path("shared").iterdir():
                  if source.is_file():
                      assert bundle.read("assets/" + source.name) == source.read_bytes(), source.name
          print("Verified Android 0.3.0 (3), original package ID and exact bundled interface.")
          PY
      - name: Allow this runner to use the emulator
        run: sudo setfacl -m u:"$(id -un)":rw /dev/kvm
      - name: Test journal and Google-enabled screen in Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/emulator-smoke.sh
      - name: Keep emulator reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baby-together-android-smoke
          path: |
            out/android-smoke/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Package unsigned build and signing tool
        run: |
          mkdir -p out/android
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/android/baby-together-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" out/android/apksigner.jar
          cp scripts/sign-android.sh out/android/
          cp config/google-oauth.json out/android/
          cp android/app/build/reports/lint-results-release.html out/android/
      - uses: actions/upload-artifact@v4
        with:
          name: baby-together-android-unsigned
          path: out/android/
          retention-days: 30
  ios:
    needs: core
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      - name: Compile iPhone simulator app
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_URL_SCHEME: ${{ vars.GOOGLE_IOS_URL_SCHEME || 'com.natibiton.babytogether' }}
        run: |
          node scripts/check-google-config.cjs ios
          xcodebuild -project ios/BabyTogether.xcodeproj -scheme BabyTogether -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build/DerivedData CODE_SIGNING_ALLOWED=NO GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" GOOGLE_URL_SCHEME="$GOOGLE_URL_SCHEME" build
          python3 scripts/check-ios-app.py ios/build/DerivedData/Build/Products/Debug-iphonesimulator/BabyTogether.app --platform iPhoneSimulator
          ditto -c -k --sequesterRsrc --keepParent ios/build/DerivedData/Build/Products/Debug-iphonesimulator/BabyTogether.app baby-together-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: baby-together-ios-simulator
          path: baby-together-ios-simulator.zip
          retention-days: 30
      - name: Archive for physical iPhone without signing
        run: |
          xcodebuild -project ios/BabyTogether.xcodeproj -scheme BabyTogether -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath ios/build/BabyTogether-unsigned.xcarchive CODE_SIGNING_ALLOWED=NO archive
          python3 scripts/check-ios-app.py ios/build/BabyTogether-unsigned.xcarchive/Products/Applications/BabyTogether.app --platform iPhoneOS
          ditto -c -k --sequesterRsrc --keepParent ios/build/BabyTogether-unsigned.xcarchive baby-together-ios-device-unsigned.zip
      - name: Keep device build for signing preparation
        uses: actions/upload-artifact@v4
        with:
          name: baby-together-ios-device-unsigned
          path: baby-together-ios-device-unsigned.zip
          retention-days: 30
